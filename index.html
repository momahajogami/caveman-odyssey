<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caveman Odyssey</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 18px; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #fdfaf5;
      color: #1a1a1a;
      line-height: 1.7;
      max-width: 720px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: normal;
      line-height: 1.2;
      margin-bottom: 0.3rem;
      letter-spacing: -0.01em;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #888;
      font-style: italic;
      margin-bottom: 3rem;
    }
    h2 {
      font-size: 0.78rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: #aaa;
      margin-top: 2.8rem;
      margin-bottom: 1.2rem;
    }
    .episode-list {
      list-style: none;
      border-top: 2px solid #e0d8cc;
    }
    .episode-list li {
      border-bottom: 1px solid #e0d8cc;
    }
    .episode-list a {
      display: flex;
      gap: 1.5rem;
      padding: 1.1rem 0;
      text-decoration: none;
      color: inherit;
      align-items: baseline;
    }
    .episode-list a:hover .ep-title {
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .ep-body { flex: 1; }
    .ep-title {
      font-size: 1.05rem;
      display: block;
      margin-bottom: 0.15rem;
    }
    .ep-desc {
      font-size: 0.82rem;
      color: #888;
      font-style: italic;
    }
    .ep-links {
      font-size: 0.75rem;
      color: #bbb;
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }
    .ep-links a {
      color: #aaa;
      text-decoration: none;
      padding: 0;
    }
    .ep-links a:hover { color: #555; text-decoration: underline; }
    .footer {
      margin-top: 5rem;
      font-size: 0.78rem;
      color: #bbb;
      border-top: 1px solid #e0d8cc;
      padding-top: 2rem;
    }
  </style>
</head>
<body>

  <h1>Caveman Odyssey</h1>
  <p class="subtitle">Homer, retold with very few words &mdash; for puppet shows and young travelers</p>

  <h2>Episodes</h2>

    <li>

        </span>
      </a>
      <span class="ep-links">
        <a href="episodes/book-02-council.html">read</a>
        <a href="episodes/book-02-council-print.html">print</a>
      </span>
    </li>

    <!-- add episodes here -->

  </ul>

  <div class="footer">Ralph Hutchison &mdash; for young adventurers</div>

  <script>
  (function () {
    var FAMILIES = {
      teal:    { hc: 172, hd: 12, sat: 70, lc: 28, lr: 8 },
      slate:   { hc: 215, hd:  8, sat: 40, lc: 28, lr: 8 },
      forest:  { hc: 140, hd: 10, sat: 60, lc: 25, lr: 8 },
      amber:   { hc:  36, hd:  8, sat: 75, lc: 28, lr: 8 },
      violet:  { hc: 268, hd: 14, sat: 60, lc: 26, lr: 8 },
      magenta: { hc: 312, hd: 10, sat: 65, lc: 26, lr: 8 }
    };
    var CYCLE = ['amber', 'violet', 'forest', 'teal', 'magenta', 'slate'];

    function hsvToRgb(h, s, v) {
      h = ((h % 360) + 360) % 360;
      var c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c, r, g, b;
      if (h < 60)       { r = c; g = x; b = 0; }
      else if (h < 120) { r = x; g = c; b = 0; }
      else if (h < 180) { r = 0; g = c; b = x; }
      else if (h < 240) { r = 0; g = x; b = c; }
      else if (h < 300) { r = x; g = 0; b = c; }
      else              { r = c; g = 0; b = x; }
      return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
    }
    function letterColor(i, fam, phase) {
      var PHI = 1.6180339887, PHI2 = 2.6180339887, freq = 0.45;
      var h = ((fam.hc + fam.hd * Math.sin(i*freq+phase)) % 360 + 360) % 360;
      var s = Math.max(0, Math.min(1, fam.sat/100 + 0.18*Math.sin(i*freq*PHI+phase+1.1)));
      var v = Math.max(0.08, Math.min(0.60, 0.30 + 0.18*Math.sin(i*freq*PHI2+phase+2.3)));
      return 'rgb(' + hsvToRgb(h, s, v) + ')';
    }
    function colorize(el, fam) {
      var phase = Math.random() * Math.PI * 2, i = 0;
      var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      var nodes = [], n;
      while ((n = walker.nextNode())) nodes.push(n);
      nodes.forEach(function(node) {
        var frag = document.createDocumentFragment();
        for (var ci = 0; ci < node.nodeValue.length; ci++) {
          var ch = node.nodeValue[ci];
          if (/\s/.test(ch)) { frag.appendChild(document.createTextNode(ch)); }
          else {
            var sp = document.createElement('span');
            sp.style.color = letterColor(i++, fam, phase);
            sp.textContent = ch;
            frag.appendChild(sp);
          }
        }
        node.parentNode.replaceChild(frag, node);
      });
    }
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.ep-title').forEach(function(el, idx) {
        colorize(el, FAMILIES[CYCLE[idx % 6]]);
      });
      document.querySelectorAll('h1').forEach(function(el) {
        colorize(el, FAMILIES['amber']);
      });
    });
  })();
  </script>

</body>
</html>
